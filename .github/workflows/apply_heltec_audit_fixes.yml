name: Prepare audited Heltec replacement tree
on:
  push:
    branches: ["audit/heltec-v4-v2.8.0.8"]
    paths: [".github/workflows/apply_heltec_audit_fixes.yml"]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'Amoulier/meshtastic-heltec-v4-firmware'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Apply exact reviewed patch and test production paths
        run: |
          set -euo pipefail
          cat .audit/patch.b64.part{0,1,2,3,4} | base64 --decode | gzip -d > /tmp/heltec.patch
          echo 'e0c02b66a5b9e8458f914a8ac93f74b3ed7a1343327babbc35bd23b4e0911da4  /tmp/heltec.patch' | sha256sum -c --strict
          git apply --check /tmp/heltec.patch
          git apply /tmp/heltec.patch
          rm .audit/patch.b64.part{0,1,2,3,4}
          rm .github/workflows/apply_heltec_audit_fixes.yml .github/workflows/withdraw_heltec_v4_2807.yml
          python3 test/host/heltec_audit_regression.py
          python3 test/host/heltec_release_policy_test.py
          git diff --check
          git add -A
      - name: Store verified Git objects without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']
          assert repo == 'Amoulier/meshtastic-heltec-v4-firmware'
          def git(*args):
              return subprocess.check_output(['git',*args]).decode().strip()
          def api(path, payload):
              req = urllib.request.Request('https://api.github.com/repos/'+repo+path,
                  data=json.dumps(payload).encode(), headers={
                  'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                  'Accept':'application/vnd.github+json', 'Content-Type':'application/json'}, method='POST')
              with urllib.request.urlopen(req,timeout=60) as r:
                  return json.load(r)
          entries=[]
          for line in git('diff','--cached','--name-status','HEAD').splitlines():
              status,path=line.split('\t')
              assert status in ('A','M','D')
              if status == 'D':
                  entries.append({'path':path,'mode':'100644','type':'blob','sha':None})
              else:
                  mode,expected,_ = git('ls-files','--stage',path).split(None,3)[:3]
                  content=Path(path).read_bytes()
                  response=api('/git/blobs',{'encoding':'base64','content':base64.b64encode(content).decode()})
                  assert response['sha']==expected,(path,response['sha'],expected)
                  entries.append({'path':path,'mode':mode,'type':'blob','sha':response['sha']})
          result=api('/git/trees',{'base_tree':git('rev-parse','HEAD^{tree}'),'tree':entries})
          assert result['sha']==git('write-tree')
          evidence={'base_commit':git('rev-parse','HEAD'),'tree_sha':result['sha'],
              'patch_sha256':hashlib.sha256(Path('/tmp/heltec.patch').read_bytes()).hexdigest(),
              'changed_paths':[e['path'] for e in entries], 'branch_updated':False}
          Path('/tmp/apply-result.json').write_text(json.dumps(evidence,indent=2))
          print(json.dumps(evidence,indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: prepared-heltec-2808-tree
          path: /tmp/apply-result.json
          if-no-files-found: error
