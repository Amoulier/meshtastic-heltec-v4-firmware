name: Audit MQTT implicit ACK and Muzi Base

on:
  push:
    branches:
      - audit/mqtt-implicit-ack-2.8.0
  workflow_dispatch:

permissions: read-all

jobs:
  native-tests:
    permissions:
      contents: read
      actions: read
      checks: write
    uses: ./.github/workflows/test_native.yml

  build-muzi-base:
    uses: ./.github/workflows/build_firmware.yml
    with:
      version: 2.8.0-superbase-upstream-power-audit
      platform: nrf52840
      pio_env: muzi-base
