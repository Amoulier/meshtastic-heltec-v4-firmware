name: Heltec shared-code integration audit

on:
  workflow_call:

permissions:
  contents: read

jobs:
  native-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: [shared, storage]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/heltec-ci/native-cache
          key: heltec-native-container-v1-${{ matrix.group }}-${{ runner.os }}-${{ hashFiles('Dockerfile.test', 'test/host/native-requirements.txt') }}-${{ github.sha }}
          restore-keys: |
            heltec-native-container-v1-${{ matrix.group }}-${{ runner.os }}-${{ hashFiles('Dockerfile.test', 'test/host/native-requirements.txt') }}-
      - name: Run the shared local and GitHub native environment
        run: bash bin/test-native-docker.sh --group ${{ matrix.group }}
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always()
        with:
          path: ~/.cache/heltec-ci/native-cache
          key: heltec-native-container-v1-${{ matrix.group }}-${{ runner.os }}-${{ hashFiles('Dockerfile.test', 'test/host/native-requirements.txt') }}-${{ github.sha }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: heltec-native-audit-${{ matrix.group }}-${{ github.sha }}
          path: .pio/ci/native/${{ matrix.group }}/
          if-no-files-found: error
