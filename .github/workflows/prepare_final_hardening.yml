name: Prepare final Heltec hardening
on:
  push:
    branches: ["audit-helper/heltec-native-repairs"]
    paths: [".github/workflows/prepare_final_hardening.yml"]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 042116c3c9a03bf2f0b8be782f32874574431585
          persist-credentials: false
      - name: Apply exact reviewed patch and test production paths
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,subprocess
          from pathlib import Path
          encoded=''''''
          patch=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='d78ea2d40c8c85dac87f393fbfe25820a94eb3c5fcc36dc13a7fae2400361f60'
          Path('/tmp/final.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','/tmp/final.patch'],check=True)
          subprocess.run(['git','apply','/tmp/final.patch'],check=True)
          PY
          python3 test/host/heltec_audit_regression.py
          python3 test/host/heltec_release_policy_test.py
          git diff --check
      - name: Store verified blobs without moving branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,subprocess,urllib.request
          from pathlib import Path
          paths=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert len(paths)==7,paths
          entries=[]
          for path in paths:
              content=Path(path).read_bytes()
              expected=hashlib.sha1(b'blob '+str(len(content)).encode()+b'\0'+content).hexdigest()
              req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs',
                  data=json.dumps({'encoding':'base64','content':base64.b64encode(content).decode()}).encode(),
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=60) as response: blob=json.load(response)
              assert blob['sha']==expected
              entries.append({'path':path,'mode':'100644','type':'blob','sha':expected})
          print(json.dumps(entries,indent=2))
          Path('/tmp/final-blobs.json').write_text(json.dumps(entries,indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: final-hardening-blobs
          path: /tmp/final-blobs.json
          if-no-files-found: error
