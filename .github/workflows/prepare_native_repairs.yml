name: Prepare native audit repairs
on:
  push:
    branches: ["audit-helper/heltec-native-repairs"]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Apply verified audit-only repair patch
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,subprocess
          from pathlib import Path
          encoded=''''''
          # Normalize the single wrapped transport typo before verifying the exact patch.
          encoded=encoded.replace('fHT8cX9pqfzy','fHT8cX9qfzy')
          patch=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='075d05c07da0112043fad8c2bbed065c462cc9564d5401b94befa4b452ef3590'
          Path('/tmp/native-repair.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','/tmp/native-repair.patch'],check=True)
          subprocess.run(['git','apply','/tmp/native-repair.patch'],check=True)
          PY
          python3 test/host/heltec_audit_regression.py
          python3 test/host/heltec_release_policy_test.py
          git diff --check
      - name: Upload exact changed Git blobs without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,subprocess,urllib.request
          from pathlib import Path
          entries=[]
          paths=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert len(paths)==6,paths
          for path in paths:
              content=Path(path).read_bytes()
              expected=hashlib.sha1(b'blob '+str(len(content)).encode()+b'\0'+content).hexdigest()
              req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs',
                  data=json.dumps({'encoding':'base64','content':base64.b64encode(content).decode()}).encode(),
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=60) as response:
                  blob=json.load(response)
              assert blob['sha']==expected
              entries.append({'path':path,'mode':'100644','type':'blob','sha':expected})
          Path('/tmp/native-repair-blobs.json').write_text(json.dumps(entries,indent=2))
          print(json.dumps(entries,indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-repair-blobs
          path: /tmp/native-repair-blobs.json
          if-no-files-found: error
