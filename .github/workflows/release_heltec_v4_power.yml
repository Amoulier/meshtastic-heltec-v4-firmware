name: Build and Release Heltec V4 Profiles

on:
  push:
    branches:
      - "main"
      - "feature/**"
      - "fix/**"

permissions: read-all

concurrency:
  group: heltec-v4-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-audit:
    uses: ./.github/workflows/audit_native_heltec.yml

  build-standard:
    uses: ./.github/workflows/build_firmware.yml
    with:
      version: ${{ github.ref_name == 'main' && 'heltec-v4-standard-v2.8.0.9' || format('heltec-v4-standard-test-{0}', github.sha) }}
      platform: esp32s3
      pio_env: heltec-v4-standard

  build-solar-router:
    uses: ./.github/workflows/build_firmware.yml
    with:
      version: ${{ github.ref_name == 'main' && 'heltec-v4-solar-router-v2.8.0.9' || format('heltec-v4-solar-router-test-{0}', github.sha) }}
      platform: esp32s3
      pio_env: heltec-v4-solar-router

  release:
    if: github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release(heltec-v4):')
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    needs:
      - native-audit
      - build-standard
      - build-solar-router
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Resolve exact source version
        id: source-version
        run: |
          set -euo pipefail
          version_json=$(python3 bin/buildinfo.py json)
          jq -e --arg commit "$GITHUB_SHA" '.source.commit == $commit and .source.dirty == false' <<<"$version_json" >/dev/null
          firmware_version=$(jq -er .long <<<"$version_json")
          source_sha256=$(jq -er .source.sha256 <<<"$version_json")
          identity_sha256=$(jq -er .identity_sha256 <<<"$version_json")
          echo "firmware_version=$firmware_version" >> "$GITHUB_OUTPUT"
          echo "source_sha256=$source_sha256" >> "$GITHUB_OUTPUT"
          echo "identity_sha256=$identity_sha256" >> "$GITHUB_OUTPUT"

      - name: Verify release provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: heltec-v4-profiles-v2.8.0.9
        run: |
          set -euo pipefail

          test "$GITHUB_REF" = "refs/heads/main"

          remote_main=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | awk '{print $1}')
          test -n "$remote_main"
          if [[ "$remote_main" != "$GITHUB_SHA" ]]; then
            echo "Refusing release: origin/main is $remote_main, workflow SHA is $GITHUB_SHA" >&2
            exit 1
          fi

          if ! remote_tag=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${RELEASE_TAG}"); then
            echo "Refusing release: unable to verify whether tag ${RELEASE_TAG} exists" >&2
            exit 1
          fi
          if [[ -n "$remote_tag" ]]; then
            echo "Refusing release: tag ${RELEASE_TAG} already exists" >&2
            exit 1
          fi

          verify_release_tag_absent_including_drafts() {
            local page=1 payload count match_status
            while true; do
              if ! payload=$(curl --fail --silent --show-error \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases?per_page=100&page=${page}"); then
                echo "Refusing release: unable to inventory existing releases and drafts" >&2
                return 1
              fi
              if ! jq -e 'type == "array" and all(.[]; (type == "object") and (.tag_name | type == "string"))' \
                <<<"$payload" >/dev/null; then
                echo "Refusing release: GitHub release inventory had an invalid schema" >&2
                return 1
              fi
              match_status=0
              jq -e --arg tag "$RELEASE_TAG" 'any(.[]; .tag_name == $tag)' \
                <<<"$payload" >/dev/null || match_status=$?
              case "$match_status" in
                0)
                  echo "Refusing release: an existing release or draft already uses ${RELEASE_TAG}" >&2
                  return 1
                  ;;
                1) ;;
                *)
                  echo "Refusing release: unable to validate the GitHub release inventory" >&2
                  return 1
                  ;;
              esac
              if ! count=$(jq -er 'length' <<<"$payload"); then
                echo "Refusing release: unable to count the GitHub release inventory" >&2
                return 1
              fi
              [[ "$count" -eq 100 ]] || return 0
              page=$((page + 1))
            done
          }
          # Invoke as a plain command, not an `if` condition: Bash suppresses errexit
          # inside functions used as conditions. Every API/JSON failure must block release.
          verify_release_tag_absent_including_drafts

      - name: Download Standard firmware
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: firmware-esp32s3-heltec-v4-standard-heltec-v4-standard-v2.8.0.9
          path: release-assets/standard

      - name: Download Solar Router firmware
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: firmware-esp32s3-heltec-v4-solar-router-heltec-v4-solar-router-v2.8.0.9
          path: release-assets/solar-router

      - name: Verify and package profile assets
        env:
          FIRMWARE_VERSION: ${{ steps.source-version.outputs.firmware_version }}
          SOURCE_SHA256: ${{ steps.source-version.outputs.source_sha256 }}
          IDENTITY_SHA256: ${{ steps.source-version.outputs.identity_sha256 }}
        run: |
          set -euo pipefail

          firmware_version="$FIRMWARE_VERSION"

          validate_profile() {
            local directory="$1"
            local target="$2"
            local manifest="$directory/firmware-${target}-${firmware_version}.mt.json"
            local normal_bin="firmware-${target}-${firmware_version}.bin"
            local elf="firmware-${target}-${firmware_version}.elf"
            local factory_bin="firmware-${target}-${firmware_version}.factory.bin"
            local littlefs_bin="littlefs-${target}-${firmware_version}.bin"
            local ota_bin="mt-esp32s3-ota.bin"
            local manifest_rows="$directory/.verified-manifest-files.tsv"
            local asset_rows
            local file_count

            file_count=$(find "$directory" -maxdepth 1 -type f | wc -l)
            test "$file_count" -eq 10
            test -z "$(find "$directory" -mindepth 1 -maxdepth 1 ! -type f -print -quit)"

            asset_rows=$(mktemp)
            find "$directory" -maxdepth 1 -type f -print0 > "$asset_rows"
            while IFS= read -r -d '' asset; do
              case "$(basename "$asset")" in
                device-install.bat | device-install.sh | device-update.bat | device-update.sh | \
                "firmware-${target}-${firmware_version}.bin" | \
                "firmware-${target}-${firmware_version}.elf" | \
                "firmware-${target}-${firmware_version}.factory.bin" | \
                "firmware-${target}-${firmware_version}.mt.json" | \
                "littlefs-${target}-${firmware_version}.bin" | mt-esp32s3-ota.bin) ;;
                *)
                  echo "Unexpected ${target} payload: $asset" >&2
                  exit 1
                  ;;
              esac
            done < "$asset_rows"
            rm "$asset_rows"

            test -s "$manifest"
            jq -e --arg target "$target" --arg version "$firmware_version" \
              --arg commit "$GITHUB_SHA" --arg source_sha256 "$SOURCE_SHA256" --arg identity_sha256 "$IDENTITY_SHA256" \
              --arg normal_bin "$normal_bin" --arg elf "$elf" --arg factory_bin "$factory_bin" \
              --arg littlefs_bin "$littlefs_bin" --arg ota_bin "$ota_bin" \
              '.platformioTarget == $target and .version == $version and .mcu == "esp32s3" and
               .repo == "Amoulier/meshtastic-heltec-v4-firmware" and .hwModelSlug == "HELTEC_V4" and
               .partitionScheme == "16MB" and
               .upstream_version == "2.8.0" and .fork_revision == 9 and
               .source.commit == $commit and .source.dirty == false and
               .source.sha256 == $source_sha256 and .identity_sha256 == $identity_sha256 and
               (.part | type == "array" and length == 6) and
               ([.part[].name] | unique | length == 6) and
               ([.part[].offset] | unique | length == 6) and
               ([.part[] | select(.name == "nvs" and .type == "data" and .subtype == "nvs" and
                    .offset == "0x9000" and .size == "0x5000" and .flags == "")] | length == 1) and
               ([.part[] | select(.name == "otadata" and .type == "data" and .subtype == "ota" and
                    .offset == "0xe000" and .size == "0x2000" and .flags == "")] | length == 1) and
               ([.part[] | select(.name == "app0" and .type == "app" and .subtype == "ota_0" and
                    .offset == "0x10000" and .size == "0x640000" and .flags == "")] | length == 1) and
               ([.part[] | select(.name == "app1" and .type == "app" and .subtype == "ota_1" and
                    .offset == "0x650000" and .size == "0x640000" and .flags == "")] | length == 1) and
               ([.part[] | select(.name == "spiffs" and .type == "data" and .subtype == "spiffs" and
                    .offset == "0xc90000" and .size == "0x360000" and .flags == "")] | length == 1) and
               ([.part[] | select(.name == "coredump" and .type == "data" and .subtype == "coredump" and
                    .offset == "0xFF0000" and .size == "0x10000" and .flags == "")] | length == 1) and
               (.files | type == "array") and (.files | length == 5) and
               ([.files[].name] | sort) == ([$normal_bin, $elf, $factory_bin, $littlefs_bin, $ota_bin] | sort) and
               ([.files[].name] | unique | length == 5) and
               (all(.files[];
                 (.name | type == "string") and
                 (.md5 | type == "string" and test("^[0-9a-f]{32}$")) and
                 (.sha256 | type == "string" and test("^[0-9a-f]{64}$")) and
                 (.bytes | type == "number" and . > 0 and floor == .) and
                 (if .name == $normal_bin then .part_name == "app0" and .bytes <= 6553600
                  elif .name == $factory_bin then (has("part_name") | not) and .bytes <= 6619136
                  elif .name == $littlefs_bin then .part_name == "spiffs" and .bytes <= 3538944
                  elif .name == $ota_bin then .part_name == "app1" and .bytes == 636544
                  elif .name == $elf then (has("part_name") | not)
                  else false
                  end)))' "$manifest" >/dev/null

            jq -er '.files[] | [.name, .md5, .sha256, (.bytes | tostring)] | @tsv' "$manifest" > "$manifest_rows"
            test "$(wc -l < "$manifest_rows")" -eq 5

            while IFS=$'\t' read -r name expected_md5 expected_sha256 expected_bytes; do
              case "$name" in
                "firmware-${target}-${firmware_version}.bin" | \
                "firmware-${target}-${firmware_version}.elf" | \
                "firmware-${target}-${firmware_version}.factory.bin" | \
                "littlefs-${target}-${firmware_version}.bin" | mt-esp32s3-ota.bin) ;;
                *)
                  echo "Unexpected file in ${target} manifest: $name" >&2
                  exit 1
                  ;;
              esac

              test -s "$directory/$name"
              test "$(md5sum "$directory/$name" | awk '{print $1}')" = "$expected_md5"
              test "$(sha256sum "$directory/$name" | awk '{print $1}')" = "$expected_sha256"
              test "$(stat -c%s "$directory/$name")" = "$expected_bytes"
            done < "$manifest_rows"
            rm "$manifest_rows"
          }

          validate_profile release-assets/standard heltec-v4-standard
          validate_profile release-assets/solar-router heltec-v4-solar-router

          cmp -s release-assets/standard/mt-esp32s3-ota.bin \
            release-assets/solar-router/mt-esp32s3-ota.bin
          echo '3e62c5451afda604bac372444f058fc689dd588a87772ad4be90c228e04c1995  release-assets/standard/mt-esp32s3-ota.bin' \
            | sha256sum --check --strict

          mkdir -p publish

          # Artifact transfer does not preserve POSIX executable bits. Restore and verify them
          # before creating the clean-install bundles that users extract directly.
          chmod 0755 \
            release-assets/standard/device-install.sh release-assets/standard/device-update.sh \
            release-assets/solar-router/device-install.sh release-assets/solar-router/device-update.sh
          test -x release-assets/standard/device-install.sh
          test -x release-assets/standard/device-update.sh
          test -x release-assets/solar-router/device-install.sh
          test -x release-assets/solar-router/device-update.sh

          # Publish the normal application images individually for OTA updates. A factory image is
          # intentionally available only inside its complete bundle: after an erase it must be flashed
          # together with the OTA loader and LittleFS image by device-install.*.
          cp "release-assets/standard/firmware-heltec-v4-standard-${firmware_version}.bin" publish/
          cp "release-assets/solar-router/firmware-heltec-v4-solar-router-${firmware_version}.bin" publish/

          (
            cd release-assets/standard
            zip -9 -r "../../publish/heltec-v4-standard-complete-${firmware_version}.zip" .
          )
          (
            cd release-assets/solar-router
            zip -9 -r "../../publish/heltec-v4-solar-router-complete-${firmware_version}.zip" .
          )

          standard_zip_listing=$(zipinfo -l "publish/heltec-v4-standard-complete-${firmware_version}.zip")
          solar_zip_listing=$(zipinfo -l "publish/heltec-v4-solar-router-complete-${firmware_version}.zip")
          grep -E '^-rwxr-xr-x .* device-install\.sh$' <<<"$standard_zip_listing" >/dev/null
          grep -E '^-rwxr-xr-x .* device-update\.sh$' <<<"$standard_zip_listing" >/dev/null
          grep -E '^-rwxr-xr-x .* device-install\.sh$' <<<"$solar_zip_listing" >/dev/null
          grep -E '^-rwxr-xr-x .* device-update\.sh$' <<<"$solar_zip_listing" >/dev/null

          test "$(find publish -maxdepth 1 -type f | wc -l)" -eq 4
          find publish -maxdepth 1 -type f -print | sort

      - name: Verify main still points to this release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: heltec-v4-profiles-v2.8.0.9
        run: |
          set -euo pipefail
          remote_main=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | awk '{print $1}')
          test -n "$remote_main"
          if [[ "$remote_main" != "$GITHUB_SHA" ]]; then
            echo "Refusing stale release: origin/main advanced to $remote_main" >&2
            exit 1
          fi

          if ! remote_tag=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${RELEASE_TAG}"); then
            echo "Refusing release: unable to recheck whether tag ${RELEASE_TAG} exists" >&2
            exit 1
          fi
          if [[ -n "$remote_tag" ]]; then
            echo "Refusing release: tag ${RELEASE_TAG} appeared during the build" >&2
            exit 1
          fi

          verify_release_tag_absent_including_drafts() {
            local page=1 payload count match_status
            while true; do
              if ! payload=$(curl --fail --silent --show-error \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases?per_page=100&page=${page}"); then
                echo "Refusing release: unable to inventory existing releases and drafts" >&2
                return 1
              fi
              if ! jq -e 'type == "array" and all(.[]; (type == "object") and (.tag_name | type == "string"))' \
                <<<"$payload" >/dev/null; then
                echo "Refusing release: GitHub release inventory had an invalid schema" >&2
                return 1
              fi
              match_status=0
              jq -e --arg tag "$RELEASE_TAG" 'any(.[]; .tag_name == $tag)' \
                <<<"$payload" >/dev/null || match_status=$?
              case "$match_status" in
                0)
                  echo "Refusing release: an existing release or draft appeared before publish for ${RELEASE_TAG}" >&2
                  return 1
                  ;;
                1) ;;
                *)
                  echo "Refusing release: unable to validate the GitHub release inventory" >&2
                  return 1
                  ;;
              esac
              if ! count=$(jq -er 'length' <<<"$payload"); then
                echo "Refusing release: unable to count the GitHub release inventory" >&2
                return 1
              fi
              [[ "$count" -eq 100 ]] || return 0
              page=$((page + 1))
            done
          }
          # Keep the last boundary fail-closed on transport and JSON errors too.
          verify_release_tag_absent_including_drafts

      - name: Publish Heltec V4 profile release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: heltec-v4-profiles-v2.8.0.9
          target_commitish: ${{ github.sha }}
          name: Heltec V4 Standard and Solar Router v2.8.0.9
          prerelease: false
          make_latest: true
          generate_release_notes: false
          overwrite_files: false
          body: |
            Independent Meshtastic 2.8.0 firmware for the Heltec V4 OLED, with Standard and Solar Router profiles.

            Distribution revision: `v2.8.0.9`. Compiled firmware: `${{ steps.source-version.outputs.firmware_version }}`. The OLED footer displays `2.8.0-h9`.

            Changes in this revision:

            - Early boot and normal telemetry share one calibrated 15-sample battery ADC reader and the persisted custom multiplier. A verified NVS cache makes the multiplier available before preferences load.
            - Multiplier changes discard readings and filters from the previous scale. Invalid calibration, initialization failures, and failed samples cannot authorize battery-powered storage writes; Solar Router remains in protective sleep when early calibration cannot be trusted and no USB data host is connected.
            - Initial region selection persists a complete configuration generation, and PRG menu callbacks retain valid selection and text storage.
            - Preference transactions drain admitted radio work before parking the SX1262, preserving reception state and preventing maintenance or queued work from reactivating a parked radio.
            - Firmware filenames, the API, the ESP application descriptor, and manifests share one source-derived identity. Clean builds use `2.8.0-h9g<8-character fingerprint>`; modified sources use `h9d`. Manifests include full source/build-identity SHA256, source commit, and image SHA256. Old images are never renamed into the new release.
            - Windows installers correctly parse supported esptool versions with CMD delayed expansion enabled.

            Choose the profile for the intended use:

            - `heltec-v4-standard`: personal or mobile nodes, with normal Meshtastic critical-battery thresholds and wake behavior.
            - `heltec-v4-solar-router`: fixed solar infrastructure configured separately as `ROUTER` or `ROUTER_LATE`, with a 3.50 V protective cutoff, timer-only critical sleep, peripheral power isolation, and 3.65 V recovery hysteresis. An active USB data host permits local recovery.

            Both profiles default to LongFast on a clean installation and preserve existing modem settings during an update. Bluetooth remains manually controlled; disabling it permits the normal Router/power-saving sleep path. The legacy `heltec-v4` build target remains a Solar Router compatibility alias.

            Persistent display-off holds the OLED in reset. The shared GPIO36 VEXT/QuickLink rail is also turned off when the completed boot scan found no other I2C accessory, but remains powered when one was detected. UART, analog, and power-only accessories cannot be detected automatically; avoid this mode when they depend on VEXT. Holding PRG for about one second restores the display.

            Installation:

            - OTA: use the profile-specific normal `.bin` published as an individual asset.
            - Wired preserving update: extract the matching `complete` ZIP and run `device-update.sh` or `device-update.bat` with its normal `.bin` and adjacent manifest.
            - Clean installation: extract every file from the matching `complete` ZIP and run `device-install.sh` or `device-install.bat` with its `.factory.bin`. This erases existing settings and identity, then writes the application, unified OTA loader, and LittleFS together. Do not erase and flash the `.factory.bin` alone.
            - Installers require esptool 4.5.1 or newer and an explicit serial port. They verify ESP32-S3, 16 MB flash, profile/version, repository provenance, partition layout, sizes, and digests before writing. POSIX scripts also require `jq`.

            Publication is gated by both profile builds, native integration tests, host fault-injection regressions, source checks, and manifest/hash verification. The corrected Solar Router implementation was also tested on a Heltec V4.3 OLED for calibration persistence, PRG navigation, Bluetooth, and configuration preservation. Absolute voltage accuracy requires a reference measurement; validate low-voltage sleep/recovery and autonomy with the actual battery and solar supply before unattended deployment.

            Upstream base: Meshtastic `develop` through `7239fe886a30fa13cd35946fa5ae1a46a2807eeb`, with stability backports selected through `fdb67309aa8fb9a019e07160ac72024c3d25ce2d`. This independent release remains on upstream 2.8.0 and is not an official Meshtastic build.
          files: publish/*
          fail_on_unmatched_files: true
