name: Release MuziWorks Superbase 2.8.0

on:
  push:
    branches:
      - release/muzi-base-2.8.0-superbase.1
    paths:
      - .github/workflows/release_muzi_superbase_2_8_0.yml
      - test/test_radio/test_main.cpp
  workflow_dispatch:

permissions: read-all

jobs:
  native-tests:
    permissions:
      contents: read
      actions: read
      checks: write
    uses: ./.github/workflows/test_native.yml

  build-muzi-base:
    uses: ./.github/workflows/build_firmware.yml
    with:
      version: 2.8.0-superbase.2
      platform: nrf52840
      pio_env: muzi-base

  release:
    needs:
      - native-tests
      - build-muzi-base
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Muzi Base firmware
        uses: actions/download-artifact@v8
        with:
          name: firmware-nrf52840-muzi-base-2.8.0-superbase.2
          path: release-assets

      - name: Select Muzi Base release files
        shell: bash
        run: |
          shopt -s nullglob
          uf2_files=(release-assets/firmware-muzi-base-*.uf2)
          manifest_files=(release-assets/firmware-muzi-base-*.mt.json)
          ota_files=(release-assets/firmware-muzi-base-*-ota.zip)

          if [[ ${#uf2_files[@]} -ne 1 || ${#manifest_files[@]} -ne 1 || ${#ota_files[@]} -ne 1 ]]; then
            echo "Expected exactly one Muzi Base UF2, manifest, and OTA DFU package" >&2
            printf 'UF2: %s\n' "${uf2_files[@]}" >&2
            printf 'Manifest: %s\n' "${manifest_files[@]}" >&2
            printf 'OTA: %s\n' "${ota_files[@]}" >&2
            exit 1
          fi

          mkdir curated-release-assets
          cp "${uf2_files[0]}" "${manifest_files[0]}" "${ota_files[0]}" curated-release-assets/

      - name: Validate Nordic OTA DFU package
        shell: bash
        run: |
          ota_file=(curated-release-assets/firmware-muzi-base-*-ota.zip)
          mapfile -t ota_entries < <(unzip -Z1 "${ota_file[0]}" | sort)
          expected_entries=(application.bin application.dat manifest.json)

          if [[ "${ota_entries[*]}" != "${expected_entries[*]}" ]]; then
            echo "Unexpected Nordic DFU package contents" >&2
            printf 'Found: %s\n' "${ota_entries[*]}" >&2
            exit 1
          fi

          unzip -p "${ota_file[0]}" manifest.json | python -m json.tool

      - name: Create Muzi Base firmware bundle
        run: zip -j -9 firmware-muzi-base-v2.8.0-superbase.2-bundle.zip curated-release-assets/*.uf2 curated-release-assets/*.mt.json

      - name: Publish prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v2.8.0-superbase.2
          target_commitish: ${{ github.sha }}
          name: Meshtastic 2.8.0 for MuziWorks Superbase — Power and Buzzer Fixes
          prerelease: true
          generate_release_notes: false
          body: |
            Custom Meshtastic 2.8.0 build for the MuziWorks Superbase (`muzi-base`), updated to the current upstream `develop` branch at release time.

            ## Included improvements

            - Corrects **DMs Only** so the buzzer sounds only for direct messages addressed to the node.
            - Centralizes policy for All Enabled, All Disabled, Notifications, System Only, and DMs Only.
            - Prevents zero-timeout RTTTL alerts from repeating or truncating unexpectedly.
            - Adds ownership-safe shared audio playback so notifications do not interrupt system tones.
            - Restores shared I2S output pins after natural or explicit playback completion.
            - Allows the firmware to power down the Muzi Base GPS rail when GPS is disabled or idle.
            - Changes the Muzi Base default screen timeout to 30 seconds.
            - Reduces idle ICM20948 polling to 1 Hz while the sensor is sleeping.

            **RX Boosted Gain was not modified.**

            ## Validation

            This release is published only after the full native test workflow and a clean `muzi-base` firmware build succeed. Direct-message buzzer behavior was also validated on a physical MuziWorks Superbase. Battery-life improvement still depends on node configuration, traffic, display, GPS, Bluetooth, and MQTT use, so measure field runtime after installation.

            ## Installation

            - **OTA:** use the `firmware-muzi-base-*-ota.zip` Nordic DFU package. Do not extract it before selecting it in the OTA updater.
            - **USB recovery/manual install:** place the Superbase in its UF2 bootloader and copy the standalone `.uf2` file to the mounted drive.

            OTA requires the MuziWorks OTAFIX bootloader. Back up the node configuration before updating and keep the node powered throughout the transfer.

            This is an unofficial prerelease from the fork and is not an official Meshtastic stable release.
          files: |
            firmware-muzi-base-v2.8.0-superbase.2-bundle.zip
            curated-release-assets/firmware-muzi-base-*.uf2
            curated-release-assets/firmware-muzi-base-*.mt.json
            curated-release-assets/firmware-muzi-base-*-ota.zip
