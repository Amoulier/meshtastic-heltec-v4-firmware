name: Retarget Heltec V4 Release

on:
  push:
    branches:
      - "feature/heltec-v4-power-optimization"
    paths:
      - ".github/workflows/retarget_heltec_v4_release.yml"

permissions:
  contents: write

jobs:
  retarget:
    if: github.event.head_commit.message == 'chore(heltec-v4): retarget v2.8.0.3 tag'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Move release tag to the verified release commit
        run: |
          git tag --force heltec-v4-power-v2.8.0.3 52528e7de7483a19ff22f8e96de091b9a6f105fc
          git push origin refs/tags/heltec-v4-power-v2.8.0.3 --force

      - name: Verify release tag
        run: |
          test "$(git ls-remote origin refs/tags/heltec-v4-power-v2.8.0.3 | cut -f1)" = "52528e7de7483a19ff22f8e96de091b9a6f105fc"
